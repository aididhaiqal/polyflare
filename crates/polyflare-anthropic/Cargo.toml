[package]
name = "polyflare-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
polyflare-core = { path = "../polyflare-core" }
reqwest = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }

[features]
# Exposes `AnthropicOAuthClient::with_endpoints` so a DEPENDENT crate's tests can point the client
# at a mock token endpoint. Never enabled by a production build: `polyflare-server` turns it on
# through its dev-dependencies only, so `cargo build --release` cannot reach the override.
test-endpoints = []

[dev-dependencies]
tokio = { workspace = true }
polyflare-testkit = { path = "../polyflare-testkit" }
